name: Refresh IMD 2000-Seat Standing Snapshot

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours automatically
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write

# One refresh at a time: a manual run and the cron must not race each other on main.
concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true # always pull the latest security patch (runner cache can lag)

      - name: Rebuild data/seats.json & data/study.json
        run: node build-data.mjs

      - name: Commit & push updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seats.json data/study.json
          # main may have moved during the build (manual push, queued run): replay on top, the fresh snapshot wins.
          git diff --staged --quiet || (git commit -m "chore(data): auto-refresh 2,000-seat standing snapshot" && git pull --rebase -X theirs origin main && git push)
