name: Refresh IMD 2000-Seat Standing Snapshot

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours automatically
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild data/seats.json & data/study.json
        run: node build-data.mjs

      - name: Commit & push updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seats.json data/study.json
          git diff --staged --quiet || (git commit -m "chore(data): auto-refresh 2,000-seat standing snapshot" && git push)
